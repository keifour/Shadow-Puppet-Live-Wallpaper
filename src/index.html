<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'"><title>Shadow Puppet · 皮影</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="scene"></canvas><div class="grain"></div><div class="app">
<header><div class="brand"><span class="seal">影</span><div>SHADOW PUPPET<small>现实入幕 · 万物成影</small></div></div><div class="header-right"><span class="local">◈ 本地处理 · 隐私优先</span><button id="minimize" aria-label="最小化">—</button></div></header>
<main><div class="eyebrow"><span></span> INTERACTIVE LIVE WALLPAPER / 001</div><h1>让现实，<br>在桌面<span>入戏。</span></h1><p class="intro">一双手，一束光，一个流动的世界。<br>让房间里的每一次微动，化作数字山水的回响。</p><div class="status"><i id="status-dot"></i><span id="status">演示模式 · 移动鼠标，唤起涟漪</span></div></main>
<aside><div class="panel-title">幕 后 <span>STAGE CONTROL</span></div><label class="caption">视觉场景 <span>01 — 03</span></label><div class="themes"><button class="theme active" data-theme="0"><b>青山 · 墨流</b><small>JADE / INK</small></button><button class="theme" data-theme="1"><b>霓虹 · 夜行</b><small>NEON / DRIFT</small></button><button class="theme" data-theme="2"><b>朱砂 · 余烬</b><small>EMBER / DUST</small></button></div><label class="caption" for="sensitivity">轮廓灵敏度 <output id="sensitivity-value">55%</output></label><input id="sensitivity" type="range" min="10" max="95" value="55"><label class="caption" for="intensity">光影强度 <output id="intensity-value">70%</output></label><input id="intensity" type="range" min="10" max="100" value="70"><div class="camera-preview"><canvas id="mask" width="192" height="144"></canvas><div><span>◉ 光影感知</span><small id="camera-label">摄像头尚未开启</small></div></div><button class="primary" id="camera">开启摄像头 <span>↗</span></button><button class="secondary" id="wallpaper">设为桌面壁纸 <span>▣</span></button><p class="privacy">仅在你的设备上分析画面。<br>不录制、不存储、不上传。</p></aside>
<footer><span>光影无声，万物有灵。</span><div><span id="fps">— FPS</span><span>WEBGL · REALTIME</span><button id="pause">暂停画面 Ⅱ</button></div></footer></div><div id="notice" role="status" aria-live="polite"></div><video id="video" autoplay muted playsinline></video><script src="renderer.js"></script></body></html>
